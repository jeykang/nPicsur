name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload a HEIC photo
        2. Open it
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the footer, e.g. V0.7.0. For `edge`, include the date you pulled the image.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How Picsur runs
      options:
        - Docker image
        - From source
        - Other
    validations:
      required: true
  - type: dropdown
    id: storage
    attributes:
      label: Where new images are stored
      description: Under Settings → Server.
      options:
        - Database
        - S3
        - Directory on disk
        - Not sure
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Browser name and version, if relevant.
  - type: textarea
    id: log
    attributes:
      label: Server log
      description: Include relevant output from `docker logs picsur` or your server log. Remove secrets.
      render: text
