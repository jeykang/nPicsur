# Pull requests that update dependencies every week, and that fix known
# vulnerabilities as soon as GitHub reports them. CI runs on each of them.
#
# In a fork, like this repository, GitHub leaves Dependabot off until it is
# turned on in the settings, see Dependencies in CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One pull request for everything that should not break anything,
      # except NestJS, see below
      minor-and-patch:
        patterns: ['*']
        exclude-patterns: ['@nestjs/*', '@fastify/multipart']
        update-types: [minor, patch]
      # The same for security fixes. Those that need a new major version come
      # on their own, like other new major versions.
      security-minor-and-patch:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
      # Every update of NestJS in one pull request, as its packages need each
      # other, like @nestjs/core 12 needs @nestjs/common 12, and
      # @nestjs/platform-fastify 12 needs @fastify/multipart 10. While a
      # group's pull request is open, Dependabot holds back new major versions
      # of what is in it, so NestJS is not in the first group.
      nestjs:
        patterns: ['@nestjs/*', '@fastify/multipart']
    ignore:
      # New major versions of Angular need the migrations of `ng update`,
      # TypeScript and zone.js move along with Angular
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: zone.js
        update-types: ['version-update:semver-major']
      # The types of Node move along with Node itself, see below
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # The Node image every stage of the Dockerfile starts from
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new major version of Node is chosen by hand, together with .nvmrc
      # and @types/node
      - dependency-name: node
        update-types: ['version-update:semver-major']
