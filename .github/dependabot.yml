# Weekly pull requests for dependency updates. CI runs on each of them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One pull request for everything that should not break anything
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # New major versions of Angular need the migrations of `ng update`,
      # TypeScript and zone.js move along with Angular
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: zone.js
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
