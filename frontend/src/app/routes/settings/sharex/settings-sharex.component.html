<h1>ShareX configuration</h1>
<p>Each export creates an API key named “ShareX”.</p>
<div class="row">
  <mat-form-field class="col-12 col-md-4 col-xl-3" appearance="outline">
    <mat-label>Image format</mat-label>
    <mat-select [(value)]="selectedFormat">
      @for (format of formatOptions; track format) {
        <mat-option [value]="format.key">
          {{ format.value }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
  <mat-form-field class="col-12 col-md-4 col-xl-3" appearance="outline">
    <mat-label>Images expire after</mat-label>
    <mat-select [(value)]="expiresAfter">
      <mat-option value="default">Your default</mat-option>
      @for (option of ExpiryOptions; track option.seconds) {
        <mat-option [value]="option.seconds">{{ option.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
<div class="row">
  <div class="col">
    <button
      color="primary"
      mat-raised-button
      [disabled]="exporting"
      (click)="onExport()"
    >
      {{ exporting ? 'EXPORTING...' : 'EXPORT CONFIG' }}
    </button>
  </div>
</div>
