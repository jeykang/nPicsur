<div class="content-border padded">
  <div class="container centered">
    <form class="row" (ngSubmit)="onSubmit()">
      <div class="col-12 py-2">
        <img
          src="/assets/branding/text/picsur_light.svg"
          class="for-dark-theme"
          alt="Picsur Text Logo"
        />
        <img
          src="/assets/branding/text/picsur_dark.svg"
          class="for-light-theme"
          alt="Picsur Text Logo"
        />
      </div>

      <div class="col-12 py-2">
        <h1>Register your new account</h1>
      </div>

      <div class="col-12 py-2">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input
            matInput
            type="text"
            [formControl]="model.username"
            name="username"
            autocorrect="off"
            autocapitalize="none"
            required
          />
          @if (model.username.errors) {
            <mat-error>
              {{ model.usernameError }}
            </mat-error>
          }
        </mat-form-field>
      </div>

      <div class="col-12 py-2">
        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input
            matInput
            type="password"
            [formControl]="model.password"
            name="password"
            required
          />
          @if (model.password.errors) {
            <mat-error>
              {{ model.passwordError }}
            </mat-error>
          }
        </mat-form-field>
      </div>

      <div class="col-12 py-2">
        <mat-form-field appearance="outline">
          <mat-label>Confirm Password</mat-label>
          <input
            matInput
            type="password"
            [formControl]="model.passwordConfirm"
            name="confirmpassword"
            required
          />
          @if (model.passwordConfirm.errors) {
            <mat-error>
              {{ model.passwordConfirmError }}
            </mat-error>
          }
        </mat-form-field>
      </div>

      <div class="col-12 py-2">
        @if (showLogin) {
          <button
            mat-flat-button
            color="accent"
            class="mx-2"
            (click)="onLogin()"
            type="button"
          >
            LOGIN
          </button>
        }
        <button
          mat-flat-button
          color="primary"
          class="mx-2"
          type="submit"
          [disabled]="loading"
        >
          {{ loading ? 'LOADING...' : 'REGISTER' }}
        </button>
      </div>
    </form>
  </div>
</div>
