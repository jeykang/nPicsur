<div class="dialog-text">
  <div class="row">
    <div class="col-12">
      <h1>Customize image</h1>
    </div>
    <div class="col-xl-4 col-12">
      <mat-form-field subscriptSizing="dynamic">
        <mat-label>Format</mat-label>
        <mat-select [(value)]="selectedFormat">
          @for (format of formatOptions; track format) {
            <mat-option [value]="format.key">
              {{ format.value }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div class="col-xl-2 col-md-3 col-sm-6 col-12">
      <mat-form-field [matTooltip]="sizeTooltip" subscriptSizing="dynamic">
        <mat-label>Height</mat-label>
        <input
          matInput
          type="number"
          min="1"
          max="32767"
          [(ngModel)]="height"
        />
      </mat-form-field>
    </div>

    <div class="col-xl-2 col-md-3 col-sm-6 col-12">
      <mat-form-field
        subscriptSizing="dynamic"
        appearance="outline"
        [matTooltip]="sizeTooltip"
      >
        <mat-label>Width</mat-label>
        <input matInput type="number" min="1" max="32767" [(ngModel)]="width" />
      </mat-form-field>
    </div>

    <div class="col-xl-2 col-md-3 col-sm-6 col-12">
      <mat-form-field subscriptSizing="dynamic">
        <mat-label>Rotation</mat-label>
        <mat-select [(value)]="rotate">
          @for (option of rotationOptions; track option) {
            <mat-option [value]="option"> {{ option }}° </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div class="col-xl-2 col-md-3 col-sm-6 col-12">
      <mat-form-field subscriptSizing="dynamic">
        <mat-label>Quality %</mat-label>
        <input matInput type="number" min="1" max="100" [(ngModel)]="quality" />
      </mat-form-field>
    </div>

    <div class="col-xl-4 col-sm-6 col-12">
      <mat-slide-toggle [(ngModel)]="flipx">
        Flip image horizontally
      </mat-slide-toggle>
    </div>

    <div class="col-xl-4 col-sm-6 col-12">
      <mat-slide-toggle [(ngModel)]="flipy">
        Flip image vertically
      </mat-slide-toggle>
    </div>

    <div class="col-xl-4 col-sm-6 col-12">
      <mat-slide-toggle [(ngModel)]="shrinkonly">Shrink only</mat-slide-toggle>
    </div>

    <div class="col-xl-4 col-sm-6 col-12">
      <mat-slide-toggle [(ngModel)]="greyscale">Greyscale</mat-slide-toggle>
    </div>

    <div class="col-xl-4 col-sm-6 col-12">
      <mat-slide-toggle [(ngModel)]="noalpha">
        Disable transparency
      </mat-slide-toggle>
    </div>

    <div class="col-xl-4 col-sm-6 col-12">
      <mat-slide-toggle [(ngModel)]="negative">Negative</mat-slide-toggle>
    </div>

    <div class="col-12">
      <copy-field
        subscriptSizing="dynamic"
        label="Customized image URL"
        [value]="getURL()"
      ></copy-field>
    </div>
  </div>
  <div class="dialog-buttons">
    <button mat-flat-button (click)="close()">CLOSE</button>
  </div>
</div>
