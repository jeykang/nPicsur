<div class="dialog-text">
  <h2>{{ data.title }}</h2>
  <p>{{ data.description }}</p>
</div>
<div class="dialog-buttons">
  @for (button of data.buttons; track button) {
    <button mat-button [color]="button.color" (click)="onButton(button.name)">
      {{ button.text.toUpperCase() }}
    </button>
  }
</div>
