packages:
  - 'shared'
  - 'frontend'
  - 'backend'

# Only these dependencies may run install scripts, everything else is
# installed without running any code
onlyBuiltDependencies:
  - esbuild
  - lmdb
  - msgpackr-extract
  - nice-napi
  - posix.js
  - sharp

overrides:
  # @nestjs/platform-fastify pins an exact fastify version, which lags behind
  # security releases. One version for everything also keeps the types in sync.
  fastify: ^5.12.5

packageExtensions:
  # @nestjs/platform-fastify 12 imports rxjs without asking for it, so it only
  # finds it when pnpm happens to hoist it. Remove once it asks for it itself.
  '@nestjs/platform-fastify@12':
    peerDependencies:
      rxjs: ^7.1.0

# Fixes for dependencies that are no longer maintained
patchedDependencies:
  # Memory limits above 2 GB were cut down to 32 bits, which could turn them
  # off, or make them smaller than what a worker needs to start
  posix.js@0.1.2: patches/posix.js@0.1.2.patch
