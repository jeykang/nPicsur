services:
  picsur:
    image: ghcr.io/jeykang/npicsur:latest
    container_name: picsur
    ports:
      - '8080:8080'
    environment:
      # PICSUR_HOST: '0.0.0.0'
      # PICSUR_PORT: 8080

      ## Path Picsur is served under behind a reverse proxy, such as
      ## https://example.com/picsur/. Defaults to the root.
      # PICSUR_BASE_PATH: /picsur

      PICSUR_DB_HOST: picsur_postgres
      # PICSUR_DB_PORT: 5432
      # PICSUR_DB_USERNAME: picsur
      # PICSUR_DB_PASSWORD: picsur
      # PICSUR_DB_DATABASE: picsur

      ## Initial admin password. If unset, Picsur generates one on first
      ## start and prints it in the log.
      # PICSUR_ADMIN_PASSWORD: CHANGE_ME

      ## Signs login tokens. Anyone with this secret can impersonate users.
      ## If unset, a random secret is stored in the database.
      ## Generate a value with: openssl rand -base64 32
      # PICSUR_JWT_SECRET: CHANGE_ME

      ## Override only for a custom frontend
      # PICSUR_STATIC_FRONTEND_ROOT: "/picsur/frontend/dist"

      ## Encrypts saved secrets with a key kept outside the database.
      ## If unset, Picsur uses a generated key stored in the database.
      ## Generate a value with: openssl rand -base64 32
      ## Back up this key separately; encrypted secrets require it.
      # PICSUR_ENCRYPTION_KEY: CHANGE_ME

      ## Settings -> Server can override the variables below.
      ## These values apply only when no value is saved there.

      ## Maximum accepted size for uploads in bytes
      # PICSUR_MAX_FILE_SIZE: 128000000

      ## Proxies trusted to supply client addresses for rate limiting.
      ## Defaults to loopback and private IPv4 addresses. Accepts true,
      ## false, or comma-separated addresses, ranges, and named ranges:
      ## loopback, linklocal, uniquelocal.
      # PICSUR_TRUST_PROXY: "172.16.0.0/12"

      ## Public URL for image links and provider login, including the base
      ## path if there is one. Defaults to the address in the browser.
      # PICSUR_HOST_OVERRIDE: https://images.example.com

      ## Concurrent conversion limit (default: CPU count) and conversions
      ## per visitor per minute (default: 120; 0 for no rate limit)
      # PICSUR_MAX_CONCURRENT_CONVERSIONS: 4
      # PICSUR_CONVERSION_RATE_LIMIT: 120
      ## Time and memory limits per conversion (memory in MB)
      # PICSUR_CONVERSION_TIME_LIMIT: 15s
      # PICSUR_CONVERSION_MEMORY_LIMIT: 512
      ## Allow resizing, rotation, and other URL edits
      # PICSUR_ALLOW_EDITING: "true"
      ## Remove converted versions after this idle period; 0 disables cleanup
      # PICSUR_REMOVE_DERIVATIVES_AFTER: 7d

      ## Login expiry after inactivity
      # PICSUR_JWT_EXPIRY: 7d
      ## Password hashing cost. Each step doubles hashing time.
      # PICSUR_BCRYPT_STRENGTH: 10

      ## Count visits with Ackee
      # PICSUR_TRACKING_URL: https://ackee.example.com
      # PICSUR_TRACKING_ID: CHANGE_ME

      ## Warning: Verbose mode might log sensitive data
      # PICSUR_VERBOSE: "true"

      ## Store images on disk using the volume below. Move existing images
      ## from Settings -> Server, or run:
      ##   docker exec picsur node backend/dist/cli.js storage migrate
      # PICSUR_STORAGE_DRIVER: filesystem
      # PICSUR_STORAGE_PATH: /picsur/images

      ## Or in S3 compatible object storage
      # PICSUR_STORAGE_DRIVER: s3
      # PICSUR_S3_BUCKET: picsur
      # PICSUR_S3_REGION: us-east-1
      ## Custom endpoint for services such as Garage, MinIO, or RustFS
      # PICSUR_S3_ENDPOINT: https://s3.example.com
      # PICSUR_S3_FORCE_PATH_STYLE: "true"
      # PICSUR_S3_ACCESS_KEY_ID: CHANGE_ME
      # PICSUR_S3_SECRET_ACCESS_KEY: CHANGE_ME
      ## Keep Picsur's objects under this path in the bucket
      # PICSUR_S3_PREFIX: picsur/

      ## OpenID Connect login via Authelia, Authentik, Keycloak, etc.
      ## Register https://<your picsur>/user/oidc as the redirect URI.
      # PICSUR_OIDC_ISSUER: https://auth.example.com
      # PICSUR_OIDC_CLIENT_ID: picsur
      # PICSUR_OIDC_CLIENT_SECRET: CHANGE_ME
      ## The login button says "Log in with" this
      # PICSUR_OIDC_NAME: Authelia
      ## Requested scopes; openid is required
      # PICSUR_OIDC_SCOPE: openid profile email
      ## Claim used to name new accounts
      # PICSUR_OIDC_USERNAME_CLAIM: preferred_username
      ## Automatically register users who can log in through the provider
      # PICSUR_OIDC_AUTO_REGISTER: "false"
      ## Redirect to the provider automatically
      # PICSUR_OIDC_AUTO_LAUNCH: "true"
      ## Disable password login after linking your own account.
      ## Remove this variable to restore it, unless overridden in settings.
      # PICSUR_PASSWORD_LOGIN: "false"
    ## For storing images in a directory
    # volumes:
    #   - picsur-images:/picsur/images
    restart: unless-stopped
    depends_on:
      - picsur_postgres
  picsur_postgres:
    image: postgres:17-alpine
    container_name: picsur_postgres
    environment:
      POSTGRES_DB: picsur
      POSTGRES_PASSWORD: picsur
      POSTGRES_USER: picsur
    restart: unless-stopped
    volumes:
      - picsur-data:/var/lib/postgresql/data
volumes:
  picsur-data:
  # picsur-images:
